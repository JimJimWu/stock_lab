name: 🐎 黑馬雷達 - 量化勝率回測引擎

on:
  workflow_dispatch: # 🎯 允許您隨時在網頁上手動點擊執行
  schedule:
    - cron: '0 2 * * 6' # ⏰ 台灣時間每週六早上 10:00 自動執行一次

jobs:
  run-backtest-engine:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 下載最新資料庫
        uses: actions/checkout@v3

      - name: ⚙️ 建立 Python 運算環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安裝量化套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: 🚀 執行未來績效回補腳本
        run: python backtest_processor.py

      - name: 💾 自動存檔並推回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add signal_history_backtest.csv
          # 如果資料有更新就 commit，沒有變動就略過，不會報錯
          git commit -m "📊 自動更新量化回測報表 [skip ci]" || echo "No changes to commit"
          git push
