name: Stock Auto Scan

on:
  schedule:
    # 設定為台股開盤時間：週一至週五，台灣時間 09:00 - 15:00 (含興櫃完整交易時段)
    # 台灣時間 09:00 = UTC 01:00，台灣時間 15:00 = UTC 07:00
    - cron: '*/30 1-7 * * 1-5' # 每 30 分鐘定時啟動
  workflow_dispatch: # 允許手動隨時在網頁按下 Run workflow 測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝安全連線與必要套件
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests curl_cffi lxml

      - name: 執行黑馬掃描 (V19.3 雲端安全鎖版)
        env:
          # 從 GitHub Secrets 保險箱中自動讀取 Webhook URL 並注入程式中，網路完全看不見！
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python auto_scan.py
