name: 全股市黑馬掃描雷達

on:
    schedule:
        # 設定為台股開盤時間：週一至週五，台灣時間 09:00 - 15:00 (含興櫃完整交易時段)
        # 台灣時間 09:00 = UTC 01:00，台灣時間 15:00 = UTC 07:00
        - cron: '*/30 1-7 * * 1-5'
    workflow_dispatch: # 允許手動隨時在網頁按下 Run workflow 測試

jobs:
    build:
        runs-on: ubuntu-latest
        
        # 💥 【必須新增：賦予機器人寫入倉庫的權限】
        permissions:
            contents: write
            
        steps:
            - name: 檢出程式碼
              uses: actions/checkout@v4

            - name: 設定 Python 環境
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - name: 安裝安全連線與必要套件
              run: |
                  pip install --upgrade pip
                  pip install yfinance pandas requests curl_cffi lxml

            - name: 執行黑馬掃描 (V19.3 雲端安全鎖版)
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              run: |
                  # 檢查當前路徑下有哪些檔案，確認 full_market_dict.json 是否真的在對應位置
                  ls -R 
                  # 使用 -u 強制輸出 log，並且加上路徑防禦
                  python -u auto_scan.py

            # 💥 【V35.0 升級：GitHub 資料自動同步引擎，放在最後一步】
            - name: 自動提交並更新回測日誌
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  
                  # 檢查所有潛在會被更新的檔案 (包含你新增的 tracker_state.json)
                  git add signal_history_backtest.csv signal_history.csv tracker_state.json radar_elite.json
                  
                  if git diff --cached --quiet; then
                      echo "今日暫無新訊號，無需更新日誌。"
                  else
                      git commit -m "📈 自動更新回測日誌: $(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') [skip ci]"
                      
                      # 💥 關鍵修改：先拉取遠端變更並進行 rebase，解決衝突
                      git pull --rebase origin main
                      
                      # 執行推播
                      git push origin main
                      echo "✅ 成功將最新的黑馬訊號同步回 GitHub 倉庫！"
                  fi
